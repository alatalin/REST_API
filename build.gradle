plugins {
    id 'java'
}

group = 'myrambler.alatalin'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            'org.junit.jupiter:junit-jupiter:5.10.0',
            'com.codeborne:selenide:7.7.3',
            'io.rest-assured:rest-assured:5.5.1'
    )
}

test {
    useJUnitPlatform()
}